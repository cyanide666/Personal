<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacked by Cyanide</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #00ff41;
      font-family: "Courier New", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .matrix {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      font-size: 14px;
      line-height: 14px;
      overflow: hidden;
      white-space: pre;
      user-select: none;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px;
      text-shadow: 0 0 8px #00ff41, 0 0 20px #00ff41;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 7rem);
      letter-spacing: 0.08em;
      animation: glitch 1.2s infinite;
    }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.25em;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.7s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes glitch {
      0%, 88%, 100% { transform: translate(0); }
      90% { transform: translate(-3px, 2px); }
      92% { transform: translate(3px, -2px); }
      94% { transform: translate(-2px, -1px); }
      96% { transform: translate(2px, 1px); }
    }
  </style>
</head>
<body>
  <div class="matrix" id="matrix"></div>

  <main class="content">
    <h1>Hacked by Cyanide</h1>
    <div class="subtitle">&gt; SYSTEM COMPROMISED <span class="cursor"></span></div>
  </main>

  <script>
    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@&";
    const matrix = document.getElementById("matrix");

    function generateMatrix() {
      const columns = Math.ceil(window.innerWidth / 12);
      const rows = Math.ceil(window.innerHeight / 14);
      let output = "";

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < columns; c++) {
          output += chars[Math.floor(Math.random() * chars.length)];
        }
        output += "\n";
      }

      matrix.textContent = output;
    }

    generateMatrix();
    window.addEventListener("resize", generateMatrix);
    setInterval(generateMatrix, 120);
  </script>
</body>
</html>
